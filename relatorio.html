<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="120">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surebets ao vivo</title>
<style>
  body { font-family:'Segoe UI',system-ui,sans-serif; background:#0f1115; color:#e8eaf0;
         display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; padding:20px; text-align:center; }
  .box { max-width:420px; }
  .spin { width:36px; height:36px; border:3px solid #2a2e38; border-top-color:#3b82f6;
          border-radius:50%; margin:0 auto 16px; animation:g 1s linear infinite; }
  @keyframes g { to { transform:rotate(360deg); } }
  a { color:#3b82f6; }
</style>
</head>
<body>
<div class="box">
  <div class="spin"></div>
  <h2 style="font-size:18px;margin:0 0 8px">Buscando surebets...</h2>
  <p style="color:#9aa0ae;font-size:14px;line-height:1.6">
    Esta pagina e atualizada automaticamente a cada 15 minutos pelo GitHub Actions.<br><br>
    Se esta mensagem persistir por mais de 20 minutos, configure os Secrets
    <b>BB_TOKEN</b> e <b>BB_FILTRO</b> no seu repositorio (veja o README).<br><br>
    <a href="./index.html">Voltar para a calculadora</a>
  </p>
</div>
</body>
</html>
